<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800">
  <!-- Background -->
  <rect width="800" height="800" fill="#2c3e50"/>
  
  <!-- Title Section -->
  <text x="400" y="60" font-family="Arial, sans-serif" font-size="36" font-weight="bold" text-anchor="middle" fill="#ecf0f1">
    AI Trading System
  </text>
  <text x="400" y="95" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#95a5a6">
    Automated Day Trading with Multi-Stage AI Reasoning
  </text>
  
  <!-- Main Circle Flow -->
  <circle cx="400" cy="400" r="250" fill="none" stroke="#3498db" stroke-width="4" stroke-dasharray="10,5"/>
  
  <!-- Center Stats -->
  <rect x="250" y="340" width="300" height="120" rx="15" fill="#34495e" stroke="#ecf0f1" stroke-width="2"/>
  <text x="400" y="370" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#ecf0f1">
    🎯 PERFORMANCE
  </text>
  <text x="400" y="400" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#3498db">
    Target: $1,000/day
  </text>
  <text x="400" y="425" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#27ae60">
    50%+ Avg Probability
  </text>
  <text x="400" y="450" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#e74c3c">
    1% Risk per Trade
  </text>
  
  <!-- Component 1: Data (Top) -->
  <g id="data-component">
    <circle cx="400" cy="150" r="60" fill="#3498db" stroke="#ecf0f1" stroke-width="3"/>
    <text x="400" y="145" font-family="Arial, sans-serif" font-size="32" text-anchor="middle" fill="white">📊</text>
    <text x="400" y="170" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="white">DATA</text>
    
    <rect x="320" y="80" width="160" height="50" rx="5" fill="#34495e" stroke="#3498db" stroke-width="2"/>
    <text x="400" y="100" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#ecf0f1">IBKR + Polygon</text>
    <text x="400" y="115" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#95a5a6">50 stocks • 60s refresh</text>
  </g>
  
  <!-- Component 2: Indicators (Right) -->
  <g id="indicator-component">
    <circle cx="610" cy="400" r="60" fill="#27ae60" stroke="#ecf0f1" stroke-width="3"/>
    <text x="610" y="395" font-family="Arial, sans-serif" font-size="32" text-anchor="middle" fill="white">⚙️</text>
    <text x="610" y="420" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="white">INDICATORS</text>
    
    <rect x="640" y="370" width="140" height="60" rx="5" fill="#34495e" stroke="#27ae60" stroke-width="2"/>
    <text x="710" y="390" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#ecf0f1">145-Point Score</text>
    <text x="710" y="405" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#95a5a6">VWAP • MACD</text>
    <text x="710" y="420" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#95a5a6">Squeeze • Volume</text>
  </g>
  
  <!-- Component 3: AI (Bottom) -->
  <g id="ai-component">
    <circle cx="400" cy="650" r="60" fill="#e74c3c" stroke="#ecf0f1" stroke-width="3"/>
    <text x="400" y="645" font-family="Arial, sans-serif" font-size="32" text-anchor="middle" fill="white">🤖</text>
    <text x="400" y="670" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="white">AI</text>
    
    <rect x="320" y="680" width="160" height="50" rx="5" fill="#34495e" stroke="#e74c3c" stroke-width="2"/>
    <text x="400" y="700" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#ecf0f1">6-Stage Reasoning</text>
    <text x="400" y="715" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#95a5a6">qwen2.5:7b • Ollama</text>
  </g>
  
  <!-- Component 4: Execution (Left) -->
  <g id="execution-component">
    <circle cx="190" cy="400" r="60" fill="#9b59b6" stroke="#ecf0f1" stroke-width="3"/>
    <text x="190" y="395" font-family="Arial, sans-serif" font-size="32" text-anchor="middle" fill="white">📋</text>
    <text x="190" y="420" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="white">EXECUTION</text>
    
    <rect x="20" y="370" width="140" height="60" rx="5" fill="#34495e" stroke="#9b59b6" stroke-width="2"/>
    <text x="90" y="390" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#ecf0f1">Paper Trading</text>
    <text x="90" y="405" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#95a5a6">Level 2 Depth</text>
    <text x="90" y="420" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#95a5a6">Risk Controls</text>
  </g>
  
  <!-- Flow Arrows -->
  <defs>
    <marker id="arrow-white" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#ecf0f1"/>
    </marker>
  </defs>
  
  <path d="M 430 200 L 570 360" stroke="#ecf0f1" stroke-width="2" fill="none" marker-end="url(#arrow-white)"/>
  <path d="M 570 440 L 430 600" stroke="#ecf0f1" stroke-width="2" fill="none" marker-end="url(#arrow-white)"/>
  <path d="M 370 600 L 230 440" stroke="#ecf0f1" stroke-width="2" fill="none" marker-end="url(#arrow-white)"/>
  <path d="M 230 360 L 370 200" stroke="#ecf0f1" stroke-width="2" fill="none" marker-end="url(#arrow-white)"/>
  
  <!-- Three Scenarios Badge -->
  <rect x="50" y="680" width="200" height="90" rx="10" fill="#34495e" stroke="#f39c12" stroke-width="2"/>
  <text x="150" y="700" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#ecf0f1">
    3 SCENARIOS
  </text>
  <text x="150" y="720" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#e74c3c">
    🔴 Aggressive (45%+)
  </text>
  <text x="150" y="738" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#f39c12">
    🟡 Moderate (55%+)
  </text>
  <text x="150" y="756" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#27ae60">
    🟢 Conservative (70%+)
  </text>
  
  <!-- Safety Badge -->
  <rect x="550" y="680" width="200" height="90" rx="10" fill="#34495e" stroke="#27ae60" stroke-width="2"/>
  <text x="650" y="700" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#ecf0f1">
    SAFETY FIRST
  </text>
  <text x="650" y="720" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#ecf0f1">
    ✅ Paper Trading Only
  </text>
  <text x="650" y="738" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#ecf0f1">
    ✅ Daily Loss Limits
  </text>
  <text x="650" y="756" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#ecf0f1">
    ✅ Position Controls
  </text>
  
  <!-- Key Metrics Strip -->
  <rect x="50" y="50" width="700" height="2" fill="#3498db"/>
  <text x="70" y="45" font-family="Arial, sans-serif" font-size="10" fill="#95a5a6">
    v2.0
  </text>
  <text x="730" y="45" font-family="Arial, sans-serif" font-size="10" text-anchor="end" fill="#95a5a6">
    Python • ib_insync • Ollama • Dash
  </text>
  
  <!-- Bottom Strip -->
  <rect x="50" y="748" width="700" height="2" fill="#e74c3c"/>
  <text x="400" y="770" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#ecf0f1">
    10X MORE SIGNALS • 73% FASTER • &lt;5% FAILURE RATE
  </text>
</svg>