    <text x="130" y="505" font-family="Arial, sans-serif" font-size="9" fill="#34495e">• TTM Squeeze (20pts)</text>
    <text x="130" y="520" font-family="Arial, sans-serif" font-size="9" fill="#34495e">• Momentum (15pts)</text>
    <text x="130" y="535" font-family="Arial, sans-serif" font-size="9" fill="#34495e">• Confluence Bonus (10pts)</text>
    
