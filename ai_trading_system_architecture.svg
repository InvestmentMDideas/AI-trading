    <text x="680" y="1000" font-family="Arial, sans-serif" font-size="10" fill="white">• Live Level 2 Order Book | 60s Auto-refresh</text>
    <text x="680" y="1015" font-family="Arial, sans-serif" font-size="10" fill="white">• Performance Metrics | Position Tracking</text>
