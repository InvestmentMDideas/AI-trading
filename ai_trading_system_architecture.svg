    <text x="350" y="490" font-family="Arial, sans-serif" font-size="9" fill="#34495e">• VWAP Zones</text>
    <text x="350" y="505" font-family="Arial, sans-serif" font-size="9" fill="#34495e">• Entry/Exit Levels</text>
    <text x="350" y="520" font-family="Arial, sans-serif" font-size="9" fill="#34495e">• Position Sizing</text>
    
