    <text x="360" y="985" font-family="Arial, sans-serif" font-size="10" fill="white">• Position Limits</text>
    <text x="360" y="1000" font-family="Arial, sans-serif" font-size="10" fill="white">• Daily Loss Limits</text>
    <text x="360" y="1015" font-family="Arial, sans-serif" font-size="10" fill="white">• Risk Controls</text>
