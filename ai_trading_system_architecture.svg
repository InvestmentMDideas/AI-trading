    <text x="680" y="1192" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">🚀 AI Cache: 5min TTL, ~50% hit rate reduction</text>
    <text x="680" y="1209" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">🚀 60-second scan intervals | 73% faster processing</text>
