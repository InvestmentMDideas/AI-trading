<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 500">
  <!-- Background -->
  <rect width="1600" height="500" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="800" y="40" font-family="Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="middle" fill="#2c3e50">
    AI-Powered Day Trading System - Data Flow
  </text>
  
  <!-- Data Input -->
  <g id="input">
    <rect x="50" y="100" width="200" height="300" rx="10" fill="#3498db" stroke="#2c3e50" stroke-width="2"/>
    <text x="150" y="130" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="white">
      📊 DATA INPUT
    </text>
    <rect x="70" y="150" width="160" height="60" rx="5" fill="white"/>
    <text x="150" y="175" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#2c3e50">
      Interactive Brokers
    </text>
    <text x="150" y="195" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#7f8c8d">
      Real-time Data
    </text>
    
    <rect x="70" y="230" width="160" height="150" rx="5" fill="#ecf0f1"/>
    <text x="150" y="250" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#2c3e50">
      Multi-Timeframe
    </text>
    <text x="80" y="270" font-family="Arial, sans-serif" font-size="9" fill="#34495e">• 1min bars (primary)</text>
    <text x="80" y="290" font-family="Arial, sans-serif" font-size="9" fill="#34495e">• 5min, 15min, 4H</text>
    <text x="80" y="310" font-family="Arial, sans-serif" font-size="9" fill="#34495e">• Daily charts</text>
    <text x="80" y="330" font-family="Arial, sans-serif" font-size="9" fill="#34495e">• Level 2 depth</text>
    <text x="80" y="350" font-family="Arial, sans-serif" font-size="9" fill="#34495e">• 50+ stocks</text>
    <text x="80" y="370" font-family="Arial, sans-serif" font-size="9" fill="#34495e">• 60s refresh</text>
  </g>
  
  <!-- Arrow 1 -->
  <path d="M 250 250 L 320 250" stroke="#2c3e50" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <text x="285" y="240" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d" text-anchor="middle">streaming</text>
  
  <!-- Technical Analysis -->
  <g id="analysis">
    <rect x="320" y="100" width="280" height="300" rx="10" fill="#27ae60" stroke="#2c3e50" stroke-width="2"/>
    <text x="460" y="130" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="white">
      ⚙️ INDICATOR ENGINE
    </text>
    <rect x="340" y="150" width="240" height="70" rx="5" fill="white"/>
    <text x="460" y="170" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#2c3e50">
      145-Point Scoring
    </text>
    <text x="350" y="190" font-family="Arial, sans-serif" font-size="9" text-anchor="left" fill="#34495e">VWAP • MACD • EMA • Volume</text>
    <text x="350" y="205" font-family="Arial, sans-serif" font-size="9" text-anchor="left" fill="#34495e">TTM Squeeze • Momentum • ATR</text>
    
    <rect x="340" y="240" width="240" height="140" rx="5" fill="#ecf0f1"/>
    <text x="460" y="260" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#2c3e50">
      Outputs
    </text>
    <text x="350" y="280" font-family="Arial, sans-serif" font-size="9" fill="#34495e">✓ Probability: 0-100%</text>
    <text x="350" y="298" font-family="Arial, sans-serif" font-size="9" fill="#34495e">✓ Quality: LOW/MED/HIGH</text>
    <text x="350" y="316" font-family="Arial, sans-serif" font-size="9" fill="#34495e">✓ Squeeze Status</text>
    <text x="350" y="334" font-family="Arial, sans-serif" font-size="9" fill="#34495e">✓ Entry/Stop/Target</text>
    <text x="350" y="352" font-family="Arial, sans-serif" font-size="9" fill="#34495e">✓ Position Size</text>
    <text x="350" y="370" font-family="Arial, sans-serif" font-size="9" fill="#34495e">✓ Risk/Reward Ratio</text>
  </g>
  
  <!-- Arrow 2 -->
  <path d="M 600 250 L 670 250" stroke="#2c3e50" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <text x="635" y="240" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d" text-anchor="middle">scored</text>
  
  <!-- AI Analysis -->
  <g id="ai">
    <rect x="670" y="100" width="280" height="300" rx="10" fill="#e74c3c" stroke="#2c3e50" stroke-width="2"/>
    <text x="810" y="130" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="white">
      🤖 AI ANALYST
    </text>
    <rect x="690" y="150" width="240" height="70" rx="5" fill="white"/>
    <text x="810" y="170" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#2c3e50">
      Ollama (qwen2.5:7b)
    </text>
    <text x="700" y="190" font-family="Arial, sans-serif" font-size="9" text-anchor="left" fill="#34495e">6-Stage Reasoning Pipeline</text>
    <text x="700" y="205" font-family="Arial, sans-serif" font-size="9" text-anchor="left" fill="#34495e">Context → Tech → Risk → Scenarios</text>
    
    <rect x="690" y="240" width="240" height="140" rx="5" fill="#ecf0f1"/>
    <text x="810" y="260" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#2c3e50">
      3 Scenarios Generated
    </text>
    <text x="700" y="280" font-family="Arial, sans-serif" font-size="9" fill="#34495e">🔴 Aggressive (45%+)</text>
    <text x="700" y="298" font-family="Arial, sans-serif" font-size="9" fill="#34495e">🟡 Moderate (55%+)</text>
    <text x="700" y="316" font-family="Arial, sans-serif" font-size="9" fill="#34495e">🟢 Conservative (70%+)</text>
    <text x="700" y="340" font-family="Arial, sans-serif" font-size="8" font-style="italic" fill="#7f8c8d">Each with confidence score,</text>
    <text x="700" y="355" font-family="Arial, sans-serif" font-size="8" font-style="italic" fill="#7f8c8d">entry/stop/target, reasoning</text>
  </g>
  
  <!-- Arrow 3 -->
  <path d="M 950 250 L 1020 250" stroke="#2c3e50" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <text x="985" y="240" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d" text-anchor="middle">decision</text>
  
  <!-- Execution -->
  <g id="execution">
    <rect x="1020" y="100" width="250" height="300" rx="10" fill="#9b59b6" stroke="#2c3e50" stroke-width="2"/>
    <text x="1145" y="130" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="white">
      📋 EXECUTION
    </text>
    <rect x="1040" y="150" width="210" height="90" rx="5" fill="white"/>
    <text x="1145" y="170" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#2c3e50">
      Trade Management
    </text>
    <text x="1050" y="190" font-family="Arial, sans-serif" font-size="9" text-anchor="left" fill="#34495e">• Level 2 Order Book</text>
    <text x="1050" y="205" font-family="Arial, sans-serif" font-size="9" text-anchor="left" fill="#34495e">• Bid/Ask Imbalance</text>
    <text x="1050" y="220" font-family="Arial, sans-serif" font-size="9" text-anchor="left" fill="#34495e">• Paper Trading (Port 7497)</text>
    
    <rect x="1040" y="260" width="210" height="120" rx="5" fill="#ecf0f1"/>
    <text x="1145" y="280" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#2c3e50">
      Safety Controls
    </text>
    <text x="1050" y="300" font-family="Arial, sans-serif" font-size="9" fill="#34495e">✓ Paper only (no live)</text>
    <text x="1050" y="318" font-family="Arial, sans-serif" font-size="9" fill="#34495e">✓ Max $1K/position</text>
    <text x="1050" y="336" font-family="Arial, sans-serif" font-size="9" fill="#34495e">✓ Daily loss limit: $150</text>
    <text x="1050" y="354" font-family="Arial, sans-serif" font-size="9" fill="#34495e">✓ 1% risk per trade</text>
    <text x="1050" y="372" font-family="Arial, sans-serif" font-size="9" fill="#34495e">✓ Emergency stops</text>
  </g>
  
  <!-- Arrow 4 -->
  <path d="M 1270 250 L 1340 250" stroke="#2c3e50" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <text x="1305" y="240" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d" text-anchor="middle">monitor</text>
  
  <!-- Dashboard -->
  <g id="dashboard">
    <rect x="1340" y="100" width="210" height="300" rx="10" fill="#16a085" stroke="#2c3e50" stroke-width="2"/>
    <text x="1445" y="130" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="white">
      📊 DASHBOARD
    </text>
    <rect x="1360" y="150" width="170" height="230" rx="5" fill="white"/>
    <text x="1445" y="170" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#2c3e50">
      Real-time Monitoring
    </text>
    <text x="1445" y="185" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#7f8c8d">
      Port 8052
    </text>
    <text x="1370" y="210" font-family="Arial, sans-serif" font-size="9" fill="#34495e">• Signal Strength</text>
    <text x="1370" y="228" font-family="Arial, sans-serif" font-size="9" fill="#34495e">• Order Book Intel</text>
    <text x="1370" y="246" font-family="Arial, sans-serif" font-size="9" fill="#34495e">• Risk Analysis</text>
    <text x="1370" y="264" font-family="Arial, sans-serif" font-size="9" fill="#34495e">• AI Verdict Display</text>
    <text x="1370" y="282" font-family="Arial, sans-serif" font-size="9" fill="#34495e">• Live L2 Order Book</text>
    <text x="1370" y="300" font-family="Arial, sans-serif" font-size="9" fill="#34495e">• Performance Metrics</text>
    <text x="1370" y="318" font-family="Arial, sans-serif" font-size="9" fill="#34495e">• Position Tracking</text>
    <text x="1370" y="340" font-family="Arial, sans-serif" font-size="8" font-style="italic" fill="#7f8c8d">Dash + Plotly + Bootstrap</text>
    <text x="1370" y="355" font-family="Arial, sans-serif" font-size="8" font-style="italic" fill="#7f8c8d">60-second auto-refresh</text>
  </g>
  
  <!-- Stats Footer -->
  <rect x="50" y="430" width="1500" height="50" rx="8" fill="#2c3e50" stroke="#34495e" stroke-width="2"/>
  <text x="800" y="453" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="white">
    TARGET: $1,000/day profit | START: $10K capital | RISK: 1%/trade | AVG PROB: 50%+ | PARALLEL: 50 stocks | SPEED: 73% faster
  </text>
  
  <!-- Arrow marker -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#2c3e50"/>
    </marker>
  </defs>
  
  <!-- Version -->
  <text x="1550" y="490" font-family="Arial, sans-serif" font-size="8" text-anchor="end" fill="#95a5a6">
    v2.0 | Python • ib_insync • Ollama • Dash
  </text>
</svg>